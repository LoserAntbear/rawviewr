<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{csp}}';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- img-src ${webview.cspSource} blob: data:; style-src ${webview.cspSource}; -->
  <!-- <link href="${style}" rel="stylesheet"> -->
  <title>Raw Image Viewer</title>
</head>

<body>
  <div class="toolbar">
    <div class="group">
      <label for="format">Format</label>
      <select id="format"
        title="Pixel format. Channel names are listed most-significant-bit first within the packed word.">${formatOptionsHtml()}</select>
    </div>

    <div class="group">
      <label for="width">Size</label>
      <input id="width" type="number" min="0" class="narrow" placeholder="auto"
        title="Width in pixels. Empty = guess from the buffer size.">
      <span>×</span>
      <input id="height" type="number" min="0" class="narrow" placeholder="auto"
        title="Height in pixels. Empty = use every remaining row.">
      <select id="guess"
        title="Plausible dimensions for this buffer size and format."></select>
    </div>

    <div class="group">
      <label for="offset">Offset</label>
      <input id="offset" type="number" min="0" class="narrow" value="0"
        title="Bytes skipped before the first pixel (header size).">
      <label for="stride">Stride</label>
      <input id="stride" type="number" min="0" class="narrow" placeholder="auto"
        title="Bytes per row including padding. Empty = tightly packed.">
    </div>

    <div class="group">
      <select id="endian"
        title="Byte order used to assemble packed 16/32-bit pixels.">
        <option value="le">little-endian</option>
        <option value="be">big-endian</option>
      </select>
      <span id="bitorder-group" class="hidden">
        <select id="bitorder"
          title="Which end of the byte holds the first pixel of a row.">
          <option value="msb">MSB first</option>
          <option value="lsb">LSB first</option>
        </select>
      </span>
    </div>

    <div class="group">
      <select id="alpha" title="How the alpha channel is treated.">
        <option value="use">use alpha</option>
        <option value="ignore">ignore alpha</option>
      </select>
      <label class="inline"
        title="Divide colour channels by alpha (for premultiplied buffers).">
        <input id="unpremul" type="checkbox"> un-premul
      </label>
      <label class="inline"
        title="Treat the first row in the buffer as the bottom row.">
        <input id="flipy" type="checkbox"> flip Y
      </label>
    </div>

    <div class="group">
      <select id="header"
        title="Read width/height from the first bytes of the file.">
        <option value="none">no size header</option>
        <option value="u16le">u16 LE w,h @0</option>
        <option value="u16be">u16 BE w,h @0</option>
        <option value="u32le">u32 LE w,h @0</option>
        <option value="u32be">u32 BE w,h @0</option>
      </select>
    </div>

    <div class="group">
      <select id="background" title="Backdrop drawn behind transparent pixels.">
        <option value="checker">checker</option>
        <option value="black">black</option>
        <option value="white">white</option>
        <option value="magenta">magenta</option>
        <option value="editor">editor</option>
      </select>
    </div>

    <div class="group">
      <button id="zoom-out" title="Zoom out (-)">−</button>
      <span id="zoom-level" class="zoom-level">100%</span>
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="zoom-fit" title="Fit to window (f)">fit</button>
      <button id="zoom-reset" title="Actual size (0)">1:1</button>
    </div>

    <div class="group hidden" id="frame-group">
      <label>Frame</label>
      <button id="frame-prev" title="Previous frame (←)">‹</button>
      <span id="frame-label" class="zoom-level">1 / 1</span>
      <button id="frame-next" title="Next frame (→)">›</button>
      <label class="inline"
        title="Show every frame in the buffer as a tile grid.">
        <input id="frame-tiles" type="checkbox"> tiles
      </label>
    </div>

    <div class="group hidden" id="tile-group">
      <label for="tile-size">Tile</label>
      <input id="tile-size" type="range" min="48" max="512" step="8"
        value="160">
    </div>

    <div class="group">
      <button id="export-png" class="primary"
        title="Save the decoded image as a PNG.">PNG</button>
    </div>
  </div>

  <div class="stage center" id="stage">
    <div class="surface bg-checker" id="surface"><canvas id="canvas"></canvas>
    </div>
    <div class="grid hidden" id="grid"></div>
    <div class="empty hidden" id="empty">Loading buffer…</div>
  </div>

  <div class="status">
    <span id="status-geometry"></span>
    <span id="status-probe"></span>
    <span class="spacer"></span>
    <span id="status-note"></span>
  </div>
</body>

</html>
